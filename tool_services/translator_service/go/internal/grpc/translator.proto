syntax = "proto3";

package translator;

option go_package = "github.com/demo-feature-nexus/translator-service/internal/grpc";

// Translation service
service TranslatorService {
  rpc TranslateText(TextTranslateRequest) returns (TextTranslateResponse);
  rpc TranslateImage(ImageTranslateRequest) returns (ImageTranslateResponse);
  rpc GetJobStatus(JobStatusRequest) returns (JobStatusResponse);
}

// Text translation request
message TextTranslateRequest {
  string source_lang = 1;
  string target_lang = 2;
  string content = 3;
  string content_type = 4;
  string domain = 5;
  TranslationStyle style = 6;
  GlossaryRequest glossary = 7;
  TranslationOptions options = 8;
}

// Translation style
message TranslationStyle {
  string tone = 1;
  string fidelity = 2;
  bool preserve_citations = 3;
  bool preserve_latex = 4;
}

// Glossary request
message GlossaryRequest {
  string project_id = 1;
  repeated Term terms = 2;
}

// Term
message Term {
  string source = 1;
  string target = 2;
}

// Translation options
message TranslationOptions {
  bool return_alignment = 1;
  bool return_quality = 2;
}

// Text translation response
message TextTranslateResponse {
  string translation = 1;
  repeated Alignment alignment = 2;
  repeated TermHit glossary_hits = 3;
  QualityReport quality = 4;
  string trace_id = 5;
}

// Alignment
message Alignment {
  repeated int32 src_span = 1;
  repeated int32 tgt_span = 2;
}

// Term hit
message TermHit {
  string source = 1;
  string target = 2;
  int32 position = 3;
}

// Quality report
message QualityReport {
  double score = 1;
  repeated string issues = 2;
  double glossary_hit_rate = 3;
  bool number_consistency = 4;
}

// Image translation request
message ImageTranslateRequest {
  bytes image_bytes = 1;
  string source_lang = 2;
  string target_lang = 3;
  string mode = 4;
  string domain = 5;
  TranslationStyle style = 6;
  GlossaryRequest glossary = 7;
}

// Image translation response
message ImageTranslateResponse {
  repeated TranslatedBlock blocks = 1;
  string full_text_translation = 2;
  QualityReport quality = 3;
  string trace_id = 4;
}

// Translated block
message TranslatedBlock {
  string type = 1;
  repeated int32 bbox = 2;
  string source_text = 3;
  string translated_text = 4;
}

// Job status request
message JobStatusRequest {
  string job_id = 1;
}

// Job status response
message JobStatusResponse {
  string job_id = 1;
  string status = 2;
  int32 progress = 3;
  string output_ref = 4;
  string error_msg = 5;
}

