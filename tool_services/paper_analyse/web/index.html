<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PDF → TextRank（Summary + Keywords）</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; max-width: 960px; }
        form { margin-bottom: 1.5rem; display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
        textarea { width: 100%; min-height: 360px; font-family: "Fira Code", monospace; font-size: 0.9rem; }
        .status { margin-top: 0.5rem; min-height: 1.5rem; color: #555; }
        button { padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
        .label { font-weight: bold; }
    </style>
</head>
<body>
    <h1>PDF → TextRank（Summary + Keywords）</h1>
    <p>上传 PDF，后端提取文本并使用 TextRank 生成摘要与关键词（无需 GROBID/LLM）。</p>
    <form id="upload-form">
        <label class="label">
            选择 PDF：
            <input type="file" id="pdf-file" accept="application/pdf" required />
        </label>
        <button type="submit">开始转换</button>
    </form>
    <div class="status" id="status"></div>
    <textarea id="tei-output" placeholder="Summary/Doc 将显示在这里" readonly></textarea>
    <textarea id="json-output" placeholder="Chunks / Debug 将显示在这里" readonly></textarea>

    <script>
        const form = document.getElementById('upload-form');
        const statusEl = document.getElementById('status');
        const output = document.getElementById('tei-output');
        const outputJson = document.getElementById('json-output');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const fileInput = document.getElementById('pdf-file');
            if (!fileInput.files.length) {
                statusEl.textContent = '请选择一个 PDF 文件。';
                return;
            }

            statusEl.textContent = '上传并转换中，请稍候…';
            output.value = '';
            outputJson.value = '';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    body: formData,
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || '未知错误');
                }

                statusEl.textContent = `处理完成`;
                output.value = JSON.stringify(
                    { doc: data.doc || {}, summary_keywords: data.summary_keywords || {} },
                    null,
                    2
                );
                outputJson.value = JSON.stringify(
                    { chunks: data.chunks || [], text_preview: data.text_preview || "" },
                    null,
                    2
                );
            } catch (error) {
                statusEl.textContent = `转换失败：${error.message}`;
            }
        });
    </script>
</body>
</html>
