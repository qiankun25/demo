version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: demo-discovery-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - discovery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  discovery_redis_data:


