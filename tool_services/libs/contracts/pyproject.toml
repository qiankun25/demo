[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-contracts"
version = "0.1.0"
description = "Shared message contracts for Nexus microservices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]

