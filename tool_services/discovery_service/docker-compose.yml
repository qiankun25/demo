version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: discovery
      POSTGRES_USER: discovery_user
      POSTGRES_PASSWORD: discovery_pass
    ports:
      - "5434:5432"
    volumes:
      - discovery_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discovery_user -d discovery"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    # Avoid host port conflicts with other stacks; enable if you want to use the management UI.
    # ports:
    #   - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - discovery_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # Avoid host port conflicts with other stacks; enable if needed.
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    volumes:
      - discovery_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: ../..
      dockerfile: tool_services/discovery_service/Dockerfile
    environment:
      DISCOVERY_DATABASE_URL: postgresql://discovery_user:discovery_pass@db:5432/discovery
    depends_on:
      db:
        condition: service_healthy
    command: alembic upgrade head

  api:
    build:
      context: ../..
      dockerfile: tool_services/discovery_service/Dockerfile
    ports:
      - "8032:8032"
    environment:
      SERVICE_MODE: api
      DISCOVERY_DATABASE_URL: postgresql://discovery_user:discovery_pass@db:5432/discovery
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: papers
      MINIO_SECURE: "false"
      NEXUS_STORAGE_PREFIX: claimcheck/
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8032

  worker:
    build:
      context: ../..
      dockerfile: tool_services/discovery_service/Dockerfile
    environment:
      SERVICE_MODE: worker
      DISCOVERY_DATABASE_URL: postgresql://discovery_user:discovery_pass@db:5432/discovery
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: papers
      MINIO_SECURE: "false"
      NEXUS_STORAGE_PREFIX: claimcheck/
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: python -m app.worker_main

volumes:
  discovery_postgres_data:
  discovery_redis_data:
  discovery_minio_data:


